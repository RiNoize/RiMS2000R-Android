name: Android ARM64 native build

on:
  push:
    branches:
      - 'android/**'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'source/**'
      - 'external/**'
      - 'android/**'
      - '.github/workflows/android-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # GitHub runners already have command-line tools. setup-android@v3
      # attempts to install obsolete "tools" and fails on current SDK feeds.
      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'ndk;27.2.12479018'
      - name: Configure Android ARM64
        run: |
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
      - name: Build the native engine
        run: cmake --build build/android-arm64 --target rims2000r_native --parallel 2
      - name: Save the native library (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: rims2000r-android-arm64-native
          path: build/android-arm64/librims2000r_native.so
          if-no-files-found: error
