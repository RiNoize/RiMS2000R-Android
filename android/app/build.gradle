plugins { id 'com.android.application' }

android {
    namespace 'org.rinoize.rims2000r'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.rinoize.rims2000r'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_BUILD_TYPE=Release'
                targets 'rims2000r_native'
            }
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/licenseAssets') } }
}

def copyLicenses = tasks.register('copyLicenses', Copy) {
    from rootProject.file('../LICENSE.md')
    from rootProject.file('../external/dsp56300/LICENSE.md') { rename { 'DSP56300-LICENSE.md' } }
    into layout.buildDirectory.dir('generated/licenseAssets')
}
tasks.named('preBuild').configure { dependsOn copyLicenses }
