plugins { id 'com.android.application' }

// Optional A/B build: never replaces an installed alpha or its private ROM/state.
def parallelTest = providers.gradleProperty('rimsPerfSideBySide').orElse('false').get().toBoolean()

android {
    namespace 'org.rinoize.rims2000r'
    compileSdk 35
    buildFeatures { buildConfig true }
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId(parallelTest ? 'org.rinoize.rims2000r.perftest' : 'org.rinoize.rims2000r')
        manifestPlaceholders = [rimsLabel: parallelTest ? 'RiMS2000R Perf Test' : 'RiMS2000R Alpha']
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2-alpha'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
                targets 'rims2000r_native'
            }
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    // Explicit path matches the CI cache; create the key before invoking Gradle.
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/licenseAssets') } }
}

def copyLicenses = tasks.register('copyLicenses', Copy) {
    from(rootProject.file('../LICENSE.md'))
    from(rootProject.file('../external/dsp56300/LICENSE.md')) {
        rename { 'DSP56300-LICENSE.md' }
    }
    into(layout.buildDirectory.dir('generated/licenseAssets'))
}
tasks.named('preBuild').configure { dependsOn copyLicenses }
